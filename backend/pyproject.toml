[project]
name = "prompt-force-backend"
version = "0.1.0"
description = "Prompt Force API (FastAPI)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
